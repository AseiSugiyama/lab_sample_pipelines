[project]
name = "lab-sample-pipelines"
version = "0.1.0"
description = "Kubeflow Pipelines (KFP SDK v2) sample pipeline for penguin classification on Google Cloud Vertex AI Pipelines"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "google-cloud-aiplatform>=2.1.3",
    "kfp>=2.17.0",
    "matplotlib>=3.10.0",
    "numpy>=2.2.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.6.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = [
    "tests",
    "components/data_generator/tests",
    "components/transform/tests",
    "components/trainer/tests",
    "components/evaluator/tests",
]
pythonpath = [
    ".",
    "components/data_generator/src",
    "components/transform/src",
    "components/trainer/src",
    "components/evaluator/src",
]

[tool.pyright]
include = ["."]
extraPaths = [
    ".",
    "components/data_generator/src",
    "components/transform/src",
    "components/trainer/src",
    "components/evaluator/src",
]